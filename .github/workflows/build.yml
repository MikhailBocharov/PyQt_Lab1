
name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name lab1_Bocharov --add-data "lab1.ui;." --add-data "lab1_form2.ui;." --add-data "nature_044_600h600-200x200.png;." main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: lab1_Bocharov-Windows
          path: dist/lab1_Bocharov.exe
